<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GeoHistory · a world history map you can scroll through time</title>
  <meta name="description" content="Pick any year from 3000 BC to today and see who ruled where, the largest empires, and the wars, treaties and revolutions of that year on an interactive map.">
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://ngcoding10.github.io/geohistory/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GeoHistory">
  <meta property="og:title" content="GeoHistory · the world in any year">
  <meta property="og:description" content="Type a year and the map changes to show the empires, borders and events of that time.">
  <meta property="og:url" content="https://ngcoding10.github.io/geohistory/">
  <meta property="og:image" content="https://ngcoding10.github.io/geohistory/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A historical world map with empires in muted colours and a timeline">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GeoHistory · the world in any year">
  <meta name="twitter:description" content="Type a year and the map changes to show the empires, borders and events of that time.">
  <meta name="twitter:image" content="https://ngcoding10.github.io/geohistory/assets/share.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="modulepreload" href="js/main.js">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#panel">Skip to the year panel</a>

  <header class="top">
    <a class="brand" href="./" aria-label="GeoHistory home">
      <img src="assets/icon.svg" alt="" width="28" height="28">
      <span>GeoHistory</span>
    </a>
    <div class="search" role="search">
      <label for="q" class="sr">Search places, empires and events</label>
      <input id="q" type="search" placeholder="Search places, empires, events" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul id="results" class="results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
    <div class="tools">
      <button id="projBtn" class="chip" type="button" title="Switch between globe and flat map">Flat</button>
      <button id="modernBtn" class="chip" type="button" aria-pressed="false" title="Show today's borders as dashed lines">Today's borders</button>
      <button id="sourcesBtn" class="chip" type="button">Sources</button>
    </div>
  </header>

  <main class="stage">
    <div id="map" class="map" role="region" aria-label="Map of the world in the chosen year"></div>
    <div id="mapStatus" class="map-status" role="status" aria-live="polite">Loading the map…</div>
    <div class="badges">
      <button id="badge" class="badge" type="button" aria-expanded="false" aria-controls="badgeInfo" hidden>Borders as of …</button>
      <div id="badgeInfo" class="badge-info" hidden></div>
    </div>
  </main>

  <aside id="panel" class="panel" aria-label="Details" tabindex="-1" data-size="peek">
    <button id="sheetHandle" class="sheet-handle" type="button" aria-label="Expand panel" aria-expanded="false"><span></span></button>
    <div id="panelBody" class="panel-body">
      <p class="muted">Loading…</p>
    </div>
  </aside>

  <footer class="timebar" aria-label="Choose a year">
    <div class="timebar-row">
      <form id="yearForm" class="year-form" autocomplete="off">
        <label for="year" class="sr">Year or date</label>
        <input id="year" class="year-input" type="text" inputmode="text" value="1776" aria-describedby="yearHint">
        <button class="go" type="submit">Go</button>
      </form>
      <div class="steps" role="group" aria-label="Step through years">
        <button type="button" data-step="-100" aria-label="Back 100 years">−100</button>
        <button type="button" data-step="-10" aria-label="Back 10 years">−10</button>
        <button type="button" data-step="-1" aria-label="Back 1 year">−1</button>
        <button type="button" id="playBtn" class="play" aria-pressed="false" aria-label="Play, one year at a time">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="ico-play" d="M7 5v14l12-7z"/><path class="ico-pause" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button type="button" data-step="1" aria-label="Forward 1 year">+1</button>
        <button type="button" data-step="10" aria-label="Forward 10 years">+10</button>
        <button type="button" data-step="100" aria-label="Forward 100 years">+100</button>
      </div>
      <p id="yearHint" class="year-hint" aria-live="polite"></p>
    </div>
    <div class="timeline">
      <div id="ticks" class="ticks" aria-hidden="true"></div>
      <input id="slider" class="slider" type="range" min="0" max="1000" step="1" value="800" aria-label="Timeline">
      <div id="eras" class="eras" aria-hidden="true"></div>
    </div>
  </footer>

  <dialog id="sources" class="sheet" aria-labelledby="sourcesTitle">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sourcesTitle">Sources and accuracy</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div id="sourcesBody" class="prose"></div>
    </div>
  </dialog>

  <noscript><p class="noscript">GeoHistory needs JavaScript and WebGL to draw the map.</p></noscript>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
