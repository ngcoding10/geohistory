<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GeoHistory · a world history map you can scroll through time</title>
  <meta name="description" content="Pick any year from 3000 BC to today and see who ruled where, the largest empires, and the wars, treaties and revolutions of that year on an interactive map.">
  <meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181613" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://ngcoding10.github.io/geohistory/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GeoHistory">
  <meta property="og:title" content="GeoHistory · the world in any year">
  <meta property="og:description" content="Type a year and the map changes to show the empires, borders and events of that time.">
  <meta property="og:url" content="https://ngcoding10.github.io/geohistory/">
  <meta property="og:image" content="https://ngcoding10.github.io/geohistory/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A historical world map with empires in bold colours and a timeline">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GeoHistory · the world in any year">
  <meta name="twitter:description" content="Type a year and the map changes to show the empires, borders and events of that time.">
  <meta name="twitter:image" content="https://ngcoding10.github.io/geohistory/assets/share.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/web/alegreya-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="js/main.js">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#panel">Skip to the year panel</a>

  <header class="top">
    <a class="brand" href="./" aria-label="GeoHistory home">
      <img src="assets/icon.svg" alt="" width="28" height="28">
      <span>GeoHistory</span>
    </a>
    <div class="search" role="search">
      <label for="q" class="sr">Search places, empires and events</label>
      <input id="q" type="search" placeholder="Search places, empires, events" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul id="results" class="results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
    <div class="tools">
      <button id="projBtn" class="chip" type="button" title="Switch between a globe and a flat map">Flat</button>
      <button id="modernBtn" class="chip" type="button" aria-pressed="false" title="Draw today's country borders over the map as dashed blue lines">Today's borders</button>
      <button id="sourcesBtn" class="chip" type="button" title="Where the maps and events come from, and how accurate they are">Sources</button>
    </div>
  </header>

  <main class="stage">
    <div id="map" class="map" role="region" aria-label="Map of the world in the chosen year"></div>
    <div id="mapStatus" class="map-status" role="status" aria-live="polite">Loading the map…</div>
    <section id="key" class="key" aria-label="Map key"></section>
    <div class="badges">
      <button id="badge" class="badge" type="button" aria-expanded="false" aria-controls="badgeInfo" hidden>Borders as of …</button>
      <div id="badgeInfo" class="badge-info" hidden></div>
    </div>
  </main>

  <aside id="panel" class="panel" aria-label="Details" tabindex="-1" data-size="peek">
    <button id="sheetHandle" class="sheet-handle" type="button" aria-label="Expand panel" aria-expanded="false"><span></span></button>
    <div id="panelBody" class="panel-body">
      <p class="muted">Loading the year…</p>
    </div>
  </aside>

  <footer class="timebar" aria-label="Time controls">
    <div class="timebar-row">
      <form id="yearForm" class="year-form" autocomplete="off">
        <label for="year" class="sr">Go to a year or date</label>
        <input id="year" class="year-input" type="text" inputmode="text" value="1776" aria-describedby="yearHint" title="Type a year or a date, like 1914, 44 BC or 4 July 1776">
        <button class="go" type="submit">Go</button>
      </form>
      <div class="transport" role="group" aria-label="Move through time">
        <button type="button" id="prevChange" class="tbtn" aria-label="Previous border change" title="Back to the last year in which borders changed (Shift + Left arrow)">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 5h2.4v14H6zM19 5v14L9.5 12z"/></svg><span class="tl">Previous change</span></button>
        <button type="button" id="playBtn" class="play" aria-pressed="false" aria-label="Play" title="Play through time (Space)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="ico-play" d="M7 5v14l12-7z"/><path class="ico-pause" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button type="button" id="nextChange" class="tbtn" aria-label="Next border change" title="Forward to the next year in which borders change (Shift + Right arrow)">
          <span class="tl">Next change</span><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15.6 5H18v14h-2.4zM5 5v14l9.5-7z"/></svg></button>
        <label class="speed" title="How fast the years go by when you press play">
          <span class="speed-lbl">Speed</span>
          <select id="speedSel" aria-label="Play speed">
            <option value="2">Slow · 2 years/s</option>
            <option value="5">Normal · 5 years/s</option>
            <option value="20">Fast · 20 years/s</option>
            <option value="60">Fastest · 60 years/s</option>
          </select>
        </label>
      </div>
      <p id="yearHint" class="year-hint" aria-live="polite"></p>
    </div>
    <div class="timeline" id="timeline">
      <div id="eras" class="eras" aria-hidden="true"></div>
      <div id="ticks" class="ticks" aria-hidden="true"></div>
      <input id="slider" class="slider" type="range" min="0" max="4000" step="1" value="3200" aria-label="Timeline: drag to move through history">
      <output id="thumbYear" class="thumb-year" aria-hidden="true"></output>
    </div>
  </footer>

  <dialog id="sources" class="sheet" aria-labelledby="sourcesTitle">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sourcesTitle">Sources and accuracy</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div id="sourcesBody" class="prose"></div>
    </div>
  </dialog>

  <noscript><p class="noscript">GeoHistory needs JavaScript and WebGL to draw the map.</p></noscript>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
